apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: range-appset
  annotations:
    argo.octopus.com/managed: "true"
spec:
  generators:
    - git:
        repoURL: https://github.com/kim-codefresh/appset-examples.git
        revision: HEAD
        files:
          - path: "apps/**/params.json"
  template:
    metadata:
      name: "{{.app}}-{{.env}}"
      annotations:
        # Range rendered into a single string annotation — valid YAML
        # Real range directives in map keys (labels) produce invalid YAML pre-processing
        app-tags: "{{range .tags}}{{.}},{{end}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/kim-codefresh/appset-examples.git
        targetRevision: HEAD
        path: "apps/{{.app}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.app}}-{{.env}}"
