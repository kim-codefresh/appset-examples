apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: simple-appset
  annotations:
    argo.octopus.com/managed: "true"
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/kim-codefresh/appset-examples.git
        revision: HEAD
        files:
          - path: "apps/**/params.json"
  template:
    metadata:
      name: "{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/kim-codefresh/appset-examples.git
        targetRevision: HEAD
        path: "{{.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
